<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#f1ad49"/></marker><style>text{font-family:'Noto Sans CJK SC','WenQuanYi Zen Hei',sans-serif;fill:#e8edf5}.label{font-size:21px}.small{font-size:17px;fill:#b7c7da}.road{fill:#263343}.building{fill:#485c73;stroke:#8295ac;stroke-width:2}.route{fill:none;stroke:#f1ad49;stroke-width:6;marker-end:url(#arrow)}.leader{fill:none;stroke:#a0b2c7;stroke-width:1.5}</style></defs>
<rect width="1400" height="1000" fill="#101b2a"/>
<text x="48" y="55" font-size="32">MC00 · 城市位置总图</text>
<text x="48" y="90" class="small">新地理设计 · 顶视关系图 · 尺寸与高度为设计估计，源片没有证明城市地理</text>
<path d="M1210 130V60M1198 80L1210 58L1222 80" stroke="#b6c9df" stroke-width="3" fill="none"/><text x="1235" y="85" class="label">北（设计方向）</text>
<!-- Fixed view: north is up; main road remains the same through every stage. -->
<rect x="440" y="130" width="200" height="800" class="road"/>
<path d="M540 140V920" stroke="#a5a798" stroke-dasharray="18 14" stroke-width="3"/>
<path d="M435 130V930M645 130V930" stroke="#768b9f" stroke-width="4"/>
<rect x="645" y="130" width="42" height="800" fill="#34475b"/>
<text x="455" y="970" class="label">同一主路 · 不换道路／不翻轴</text>
<rect x="95" y="705" width="260" height="190" rx="5" class="building"/>
<text x="118" y="752" class="label">屋檐起幅建筑</text><text x="118" y="784" class="small">旧楼约六层／檐高约18m</text>
<path d="M355 725V705H322" stroke="#74c2df" stroke-width="7" fill="none"/>
<text x="70" y="672" class="small">沿外檐侧移，越过东北外转角</text><path d="M290 680L350 710" class="leader"/>
<rect x="785" y="525" width="190" height="155" rx="4" class="building"/>
<text x="808" y="564" class="label">旧住宅</text><text x="808" y="595" class="small">外露楼梯窗格</text><text x="808" y="626" class="small">只定位外部，不拍室内事件</text>
<path d="M783 545V635" stroke="#74c2df" stroke-width="7"/>
<rect x="651" y="365" width="35" height="104" fill="#8cb7c1" stroke="#d0e2e5" stroke-width="2"/>
<text x="95" y="342" class="label">站棚 · 沿主路东侧人行道</text><text x="95" y="371" class="small">暖顶灯／玻璃／细金属框</text><path d="M405 367L650 417" class="leader"/>
<text x="95" y="400" class="small">位于住宅之后、市政前方</text>
<path d="M690 195H1125V354H690" fill="#384c5b" stroke="#a1b5c6" stroke-width="2"/>
<text x="710" y="170" class="label">市政检修入口外作业区 · 与街面齐平</text>
<text x="713" y="385" class="small">西南侧开放入口，无高墙／无台阶挡住接近路线</text>
<path d="M690 195H1100" stroke="#aeb5b8" stroke-width="12"/>
<path d="M875 195H1040" stroke="#d6bc89" stroke-width="13"/>
<text x="928" y="225" class="small">铁门／轨道／限位</text>
<rect x="725" y="245" width="40" height="27" fill="#829ba7"/><text x="708" y="302" class="small">绞盘</text>
<circle cx="1040" cy="322" r="13" fill="#b8c7cc"/><text x="1060" y="331" class="small">回程滑轮</text>
<path d="M750 266L1040 322L965 201" stroke="#e2e7e9" stroke-width="3" fill="none"/>
<rect x="711" y="210" width="15" height="20" fill="#b3bdad"/><circle cx="748" cy="222" r="9" fill="#dfad49"/>
<text x="1070" y="258" class="small">工人＋控制盒在左</text><path d="M1055 253L765 224" class="leader"/>
<text x="1080" y="290" class="small">此处只标相对关系</text>
<!-- Proposed camera route stays outside buildings and south of the traction lines. -->
<path d="M374 815L374 715Q375 690 401 666Q433 637 471 594Q544 516 600 440Q662 360 745 345Q815 341 879 340" class="route"/>
<g fill="#f1ad49" stroke="#101b2a" stroke-width="3"><circle cx="374" cy="815" r="11"/><circle cx="417" cy="652" r="11"/><circle cx="590" cy="454" r="11"/><circle cx="745" cy="345" r="11"/><circle cx="879" cy="340" r="11"/></g>
<text x="380" y="850" class="label">A 屋檐近景</text><text x="397" y="880" class="small">约18m · 已在室外</text>
<text x="105" y="585" class="label">B 横移后展开城市</text><text x="105" y="616" class="small">约17m · 先揭示，再向前下降</text><path d="M355 605L415 651" class="leader"/>
<text x="95" y="432" class="label">C 沿同一主路缓弧下降</text><text x="95" y="465" class="small">约8m · 住宅先显露，站棚随后可认</text><path d="M465 453L578 454" class="leader"/>
<text x="87" y="260" class="label">D 绕过站棚北端，低速进入开放处</text><text x="87" y="293" class="small">约3m · 不穿玻璃，不越牵引线</text><path d="M510 285L733 343" class="leader"/>
<path d="M879 340L853 280L815 295Z" fill="#f1ad49" opacity=".2"/>
<text x="900" y="425" class="label">E 末态约1.7m</text><text x="900" y="457" class="small">东南侧看向西北 · 停在钢索外</text><text x="900" y="489" class="small">精确构图以 MC01 原片第0帧为准</text><path d="M905 412L883 350" class="leader"/>
<rect x="40" y="117" width="360" height="73" rx="7" fill="#203044"/><path d="M57 140H105" class="route"/><text x="120" y="147" class="small">相机路线（设计，尚未实测）</text><text x="57" y="175" class="small">城市位置可设计；市政末态锚点不可重画替代</text>
</svg>
