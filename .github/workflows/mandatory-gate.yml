name: mandatory-gate

"on":
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: mandatory-gate / verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      HARNESS_RUN_ID: pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Inspect exact PR routes
        id: harness-routes
        shell: bash
        run: |
          set -o pipefail
          python scripts/agent_harness.py inspect \
            --base-ref "${BASE_SHA}" \
            --head-ref "${HEAD_SHA}" \
            | tee "${RUNNER_TEMP}/harness-inspection.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "harness-inspection.json")
              .read_text(encoding="utf-8")
          )
          required = bool(report["npm_workspace_dependency_paths"])
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              print(f"npm_dependencies={'true' if required else 'false'}", file=output)
          PY

      - name: Set up Node
        if: steps.harness-routes.outputs.npm_dependencies == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.21.0"
          package-manager-cache: false

      - name: Install Provider Console test dependencies
        if: steps.harness-routes.outputs.npm_dependencies == 'true'
        run: npm ci --ignore-scripts --prefix provider-console

      - name: Audit Harness policy
        shell: bash
        run: |
          set -o pipefail
          make harness-audit 2>&1 | tee mandatory-gate-audit.log

      - name: Verify exact PR range
        shell: bash
        run: |
          set -o pipefail
          make harness-verify-range \
            BASE_REF="${BASE_SHA}" \
            HEAD_REF="${HEAD_SHA}" \
            RUN_ID="${HARNESS_RUN_ID}" \
            2>&1 | tee mandatory-gate-verify.log

      - name: Verify CI receipt integrity
        run: >-
          make harness-receipt
          RECEIPT=".agent/harness/runs/${HARNESS_RUN_ID}/receipt.json"

      - name: Upload Harness receipt, JUnit, and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mandatory-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            mandatory-gate-audit.log
            mandatory-gate-verify.log
            .agent/harness/runs/${{ env.HARNESS_RUN_ID }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
