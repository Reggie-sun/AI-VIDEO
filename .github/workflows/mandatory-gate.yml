name: mandatory-gate

"on":
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: mandatory-gate / verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      HARNESS_RUN_ID: pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Audit Harness policy
        shell: bash
        run: |
          set -o pipefail
          make harness-audit 2>&1 | tee mandatory-gate-audit.log

      - name: Verify exact PR range
        shell: bash
        run: |
          set -o pipefail
          make harness-verify-range \
            BASE_REF="${BASE_SHA}" \
            HEAD_REF="${HEAD_SHA}" \
            RUN_ID="${HARNESS_RUN_ID}" \
            2>&1 | tee mandatory-gate-verify.log

      - name: Verify CI receipt integrity
        run: >-
          make harness-receipt
          RECEIPT=".agent/harness/runs/${HARNESS_RUN_ID}/receipt.json"

      - name: Upload Harness receipt, JUnit, and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mandatory-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            mandatory-gate-audit.log
            mandatory-gate-verify.log
            .agent/harness/runs/${{ env.HARNESS_RUN_ID }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
