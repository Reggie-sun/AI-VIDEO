name: skill-routing

"on":
  push:
    branches: [main]
    paths:
      - '.agents/skills/**'
      - '.claude/**'
      - '.codex/**'
      - '.mcp.json'
      - 'docs/skill-agent-routing.md'
      - 'docs/research/2026-11-16-jimeng-seedance-*.md'
      - 'tests/fixtures/jimeng-seedance-history.json'
      - 'tests/test_jimeng_history_regressions.py'
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - 'scripts/skill_*'
      - 'tests/test_skill_*'
      - 'tests/test_claude_code_adapter.py'
      - 'tests/fixtures/skill-routing-cases.json'
      - '.github/workflows/skill-routing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Check checkout without machine-local MCP services
        run: python scripts/skill_environment_check.py --checkout-only
      - name: Validate routing and adapter contracts (no live agents or media)
        run: python -m pytest -q tests/test_claude_code_adapter.py tests/test_skill_routing_eval.py tests/test_skill_environment_check.py tests/test_skill_descriptions.py tests/test_jimeng_history_regressions.py
