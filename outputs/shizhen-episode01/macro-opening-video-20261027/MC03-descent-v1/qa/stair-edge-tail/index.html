<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>失帧 · 尾段台阶局部核对</title><style>body{font:17px/1.6 system-ui,sans-serif;background:#15191b;color:#e7eeeb;margin:28px}main{max-width:1200px;margin:auto}a{color:#b5d9cb}button{padding:10px 16px;font:inherit;cursor:pointer}.scroll{overflow:auto}.roi{position:relative;overflow:hidden;width:650px;height:320px;background:#000;border:1px solid #718378}.roi video{position:absolute;left:-1100px;top:-760px;width:1920px;height:1080px;max-width:none}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}figure{margin:0}figure img{width:100%;height:auto}figcaption{color:#afc3ba}p{max-width:1000px}@media(max-width:700px){body{margin:16px}.grid{grid-template-columns:1fr}}</style><main><h1>尾段右下台阶 · 局部核对</h1><p>此处直接播放同一条原MP4的6–8秒，以原像素大小显示右下局部，保持1倍速和原声。只用于诊断，不是剪辑修订或合格成片。</p><p><button id="play">播放／循环尾段</button> <button id="pause">暂停</button> <span id="time"></span></p><div class="scroll"><div class="roi"><video id="source" preload="metadata" playsinline src="../../../失帧-下楼到达-1080p-2.0-试片01.mp4"></video></div></div><p>下方为同源裁切取帧，无缩放或修图。网页显示可能缩小，点击可打开原尺寸。对照台阶轮廓与表面纹理／反光；整数区域位移为零不足以排除细微局部不稳定。</p><div class="grid" id="frames"></div><p><a href="../../../index-descent-v1.html">完整8秒原片</a> · <a href="frame-index.json">来源与裁切范围</a></p></main><script>const v=document.querySelector('#source'),t=document.querySelector('#time');let loop=false;document.querySelector('#play').onclick=async()=>{loop=true;v.playbackRate=1;v.muted=false;v.currentTime=6;await v.play()};document.querySelector('#pause').onclick=()=>{loop=false;v.pause()};v.ontimeupdate=()=>{t.textContent=v.currentTime.toFixed(3)+' 秒';if(loop&&v.currentTime>=7.99)v.currentTime=6};v.onended=()=>{if(loop){v.currentTime=6;v.play()}};const box=document.querySelector('#frames');for(let i=1;i<=9;i++){let name='frame-'+String(i).padStart(2,'0')+'.png',f=document.createElement('figure');f.innerHTML='<a target="_blank" href="'+name+'"><img alt="台阶尾段取帧" src="'+name+'"></a><figcaption>'+((i-1)*.25+6).toFixed(2)+' 秒 · 同源局部</figcaption>';box.append(f)}</script></html>
