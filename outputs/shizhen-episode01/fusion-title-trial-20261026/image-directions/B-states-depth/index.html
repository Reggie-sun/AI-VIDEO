<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>失帧 · B方向过渡参考组</title>
<style>*{box-sizing:border-box}body{background:#0b0d0f;color:#e8e6e0;font:17px/1.65 system-ui,sans-serif;margin:0}main{max-width:1440px;margin:32px auto;padding:0 24px}h1{font-size:28px;font-weight:500}p{color:#adb4b5}img{width:100%;display:block}figure{margin:30px 0 45px}figcaption{margin:10px 0;color:#c0c7c8}.controls{display:flex;gap:10px;flex-wrap:wrap}button{background:none;border:1px solid #566166;color:#ddd;padding:8px 15px;cursor:pointer;font:inherit}button[aria-pressed=true]{background:#d5d4cc;color:#101214}a{color:#c6d3cf}#hero{border:1px solid #42494b}details{margin:25px 0}summary{cursor:pointer}.tag{font-size:13px;letter-spacing:2px;color:#9ba5a7}</style>
<main><span class="tag">失帧 / B DIRECTION / TRANSITION REFERENCES</span><h1>同一块影像，逐层失去现实</h1><p>当前推荐4个状态：入口、两张过渡态、新终态候选。取消横向擦除；原B保留在下方作对照。点击顺序检查变化；这是静态参考组，不是已完成动画。新终态保留城市透光与暖色雨痕，尚待你判断效果。</p>
<div class="controls" id="steps"></div><figure><img id="hero" src="01-entry.png" alt="01 正常彩色入口"><figcaption id="caption">01 · 正常彩色入口：片名尚未出现。</figcaption></figure>
<details open><summary>完整参考组 / 点击图片查看原尺寸</summary><div id="gallery"></div></details>
<details><summary>原 B 终态 · 对照，已非固定目标</summary><img src="05-selected-end.png" alt="原B终态对照"></details><p>保留同一站台、人物与电话姿势；只设计左侧空位的景深层次、正负片密度与字标显影。图中 AI 来源标识保留。图片不能证明实际运动连续，最终字形与准确时间仍交后期控制。</p><p><a href="receipt.json">素材与审查记录</a> · <a href="README.md">每张图的职责</a></p></main>
<script>
const states=[['01-entry.png','01 · 正常彩色入口','片名尚未出现，建立同一画面起点。'],['02-depth-loss.png','02 · 深处先缺失','远处城市影调先分离，近处雨珠与暖光仍在；没有片名。'],['03-latent-imprint.png','03 · 潜影开始可辨','字形在同一位置从影像密度中显现，雨滴与反射穿插其中。'],['04-image-settles.png','04 · 新终态候选','片名完整可读，城市影像、近景雨滴和少量暖色反光仍有层次。']];
const hero=document.querySelector('#hero'),caption=document.querySelector('#caption'),controls=document.querySelector('#steps'),gallery=document.querySelector('#gallery');
states.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s[1];b.setAttribute('aria-pressed',i===0?'true':'false');b.onclick=()=>{hero.src=s[0];hero.alt=s[1];caption.textContent=s[1]+'：'+s[2];controls.querySelectorAll('button').forEach((x,j)=>x.setAttribute('aria-pressed',i===j?'true':'false'))};controls.appendChild(b);const f=document.createElement('figure'),a=document.createElement('a'),im=document.createElement('img'),c=document.createElement('figcaption');a.href=s[0];a.target='_blank';im.src=s[0];im.alt=s[1];im.loading='lazy';a.appendChild(im);c.textContent=s[1]+'：'+s[2];f.append(a,c);gallery.appendChild(f)});
</script></html>
