<h1>《失帧》v5 记录台对白母带 · 参考包预览（待你认可）</h1>
<p>覆盖母带里的 D1 接报、D5 计数和点名尾段。图片都是静态候选，不代表视频动作、声音或成片效果。哪几张送进模型，要等核对 Seedance 2.5 所选模式的图数上限后再定；全部图先作预览。生图/修图共 11 次（原单元 10 次 + K4 修复单元 1 次），，全部有结果，没有自动重试。</p>
