<h1>照作者 Claudia 的人物设定改写</h1>
<p>作者原文：她是“28 岁的成年女性，有棱角的成熟脸，颧骨分明、下颌线硬朗”；提示词里“永远不写 young”（模型会把她画成少女）。EV 里她的神情是“面无表情，带着好奇”（deadpan and curious），唱歌时嘴张大、闭眼；“永远在做事，从不干等”；禁止网红笑。我们原来写的“二十二岁左右，年轻的成年女性……压迫感”正是少女感和冷脸的来源。</p>
