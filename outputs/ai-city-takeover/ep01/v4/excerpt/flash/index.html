<p>改了什么：风格词从“电影剧照”改成“机头直闪的夜间快照、歪构图、贴得近、有动态模糊”；固定外形文字里去掉“不笑、压迫感”那句，每张单独写表情（撇嘴、挑眉、吐舌、放声唱）。</p>
<p>要注意的一处：新图里夜景的红色霓虹和红色车灯很多，和设定“画面里只有她的灯是红色”冲突。作者 EV 自己也有红灯。要保留这条规则的话，下一版写进 prompt 或在调色里把红色压成橙/粉。</p>
