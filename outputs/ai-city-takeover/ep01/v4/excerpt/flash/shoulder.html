<h1>s011 首帧的露肩方向和前后镜头对不上</h1><img src="shoulder-compare.jpg">
<p>从左到右：s010 结尾（天桥背影，露左肩）｜你选的 s011-1（露<b>右</b>肩，长袖在左臂）｜备选 s011-2（露左肩，长袖在右臂）｜s012（露左肩）。W1 的其他静图也都是露左肩。s010 → s011 → s012 是连续硬切，选 1 会看到她的右臂从光着变成有袖子。</p>
