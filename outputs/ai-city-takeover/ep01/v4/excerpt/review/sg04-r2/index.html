<h1>s013（50.93–55.08）· 未调色原片，带母带</h1>
<p>两条都只对上了后半句 “you had to take / All hands!”，前面 “I'm the call” 嘴和歌对不上。第二条还丢了工程师的手。</p>
<h2>推荐剪法 A：前半句切到手机特写，后半句用第一条</h2>
<p>50.93–52.32 “I'm the call”：她手里那部亮着的手机（成片里来电图形贴在手机上，这正是“我就是那通电话”）；52.32 起切回她唱 “you had to take / All hands!”，工程师的手还在左下角。</p>
