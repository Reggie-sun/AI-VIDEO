<h1>参考图对比（同一段：主歌 1 + 副歌 1）</h1>
<h2>作者 EV（原片截帧）</h2><img src="ev-strip.jpg">
<h2>我们的底片</h2><img src="ours-strip.jpg">
<h2>我看到的差别</h2><ul>
<li>作者：相机机头直闪的快照照片——硬闪光、对比强、颜色饱和（红灯、蓝光、白衬衫爆白），像夜里随手拍的街拍和派对照；角度歪、贴得近、有动态模糊。</li>
<li>我们：统一的“电影感”灰蓝夜景，干净、对称、调子一样，像 AI 生成的时装海报。每张都是同一种冷灰。</li>
<li>人物：作者里她会撅嘴、吐舌、挑眉、玩世不恭；我们几乎每张都是同一种冷脸瞪人。</li>
<li>很多作者镜头本身就是一张照片加图形，没有视频动作；只有表演和关键动作才用视频。</li></ul>
