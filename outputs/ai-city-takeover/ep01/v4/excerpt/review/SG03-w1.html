<h1>s012 · 对工程师唱（W1，4k，480 积分）· 原曲配画面</h1><video controls src="SG03-w1.mp4"></video>
<p>好的地方：口型和人声全程同步（偏差 0.025 秒）；脸、造型、露左肩、耳挂红灯都对。</p>
<p>Gate 卡的地方：① 开头 2 秒镜头在动（往上摇），工程师的笔记本先是打开的、再合上；② 三段空白里她的嘴都提前张开（像唱前吸气）；③ 所以 "hold on tight" 这一句画面不好用。<b>"I'm the reason you're awake" 这一整句（片内 2–5.4 秒）是好的。</b></p>
