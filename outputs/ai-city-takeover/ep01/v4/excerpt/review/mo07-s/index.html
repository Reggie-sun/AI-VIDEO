<h1>s014 旋身（55.08–59.23）· 未调色原片，带母带</h1>
<p>镜头是固定的（看起来在动是她在走）；转身、袖子甩圆落下、向右走开都有，带子方向对。没过的两项：<b>没有按寻呼机</b>（她按的是左胯一个黑色小件），而且那个小件在 2.5 秒左右闪了一下<b>红灯</b>。</p>
<h2>推荐剪法：跳过红灯那一秒，最后补寻呼机特写</h2>
<p>55.08–57.38 她走近、急转身、袖子甩出；57.38 跳到袖子落下、她向右走开；58.77（Ten 那一拍）切到腰间寻呼机特写，成片里液晶屏亮起 10:02，接下一镜推门。下面的寻呼机特写是从视频里放大的占位，成片会单独出一张清楚的图。</p>
