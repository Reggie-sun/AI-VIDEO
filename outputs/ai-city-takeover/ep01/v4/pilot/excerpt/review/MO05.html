<h1>MO05 · 天桥踹铁丝网（4k，400 积分）</h1><video controls src="MO05.mp4"></video>
<p>动作顺序都对：靠护栏 → 踹一脚 → 插兜 → 转身走远出画；镜头稳，脸和衣服对，耳挂与红线在她左侧亮着。</p>
<p>Gate 卡了两项：① 她背对镜头走远时，后脑头发变得蓬松卷曲（左图，4K 原尺寸局部）；② 车流里出现了首帧没有的红色车尾灯（右图），按设定“画面里只有她的灯是红色”。红色车尾灯在调色时可以压成橙色。</p>
