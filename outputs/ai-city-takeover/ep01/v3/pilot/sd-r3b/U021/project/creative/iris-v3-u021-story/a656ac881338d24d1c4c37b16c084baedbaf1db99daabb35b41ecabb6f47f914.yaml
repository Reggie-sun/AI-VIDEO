synopsis: '{{image:0}}中的她对着镜头唱歌，口型与{{audio:1}}里的人声逐字精确同步。中近景，开头她闭着眼睛，嘴轻轻合上，静静等待；唱第一个字时张开嘴，她闭着眼睛投入地唱，神情平静淡然，带着一点好奇，眉头舒展；唱到句尾慢慢睁开眼睛，带着一点好奇平静地看着镜头。镜头全程锁定，一镜到底。'
