<h2>EV 作者的做法</h2><ul>
<li>人物常态神情：deadpan, curious（面无表情、带点好奇）；唱歌时嘴张开、眼睛闭上</li>
<li>出图不用脸部参考图，身份靠一段固定文字锁定</li>
<li>唱歌镜头的首帧本身就在唱（闭眼张嘴）</li>
<li>对口型用 Seedance 2.5：首帧 + 该段人声，提示词写明唱的词、神情和“镜头锁定、不切、不转头”；口型开始不同步处剪掉，再接续拍</li></ul>
