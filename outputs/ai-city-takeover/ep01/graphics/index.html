<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>IRIS · EP01 图形素材</title><style>body{margin:0;background:#0b0f14;color:#e9eef1;font:16px/1.7 system-ui,sans-serif}main{max-width:1400px;margin:36px auto;padding:0 24px}h1{font-weight:500;font-size:28px}p{color:#a8b6c4}section{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px}article{border-top:1px solid #506171}h2{font-size:20px;font-weight:500}video,img{width:100%;display:block}a{color:#afc4d8}small{display:block;margin:10px 0;color:#a8b6c4}@media(max-width:760px){section{grid-template-columns:1fr}}</style></head><body><main><h1>IRIS · EP01 解释图形素材</h1><p>四个独立4秒source：1920×1080、30fps、静音。仅局部图形，未拼接为完整MV，未加入歌曲、IRIS表演或最终字幕。可以逐个播放查看。</p><section id="cards"></section><p><a href="README.md">可编辑工程与证据说明</a> · <a href="../fact-check.md">事实来源与范围</a></p></main><script>const cards=[['dns','一次有限联网'],['pause','相关研究暂停11天'],['web-cache','离线网页缓存'],['cpu-cache','另一项受控红队测试']];for(const[id,title]of cards){const a=document.createElement('article');a.innerHTML=`<h2>${title}</h2><video src="renders/${id}.mp4" controls playsinline preload="metadata"></video><small><a href="qa/${id}/review.md">局部审查</a> · <a href="qa/${id}/contact-sheet.jpg">首中尾联系图</a> · <a href="qa/${id}/legibility-390.jpg">390px可读性</a></small>`;document.querySelector('#cards').append(a)}</script></body></html>
