constraints:
- 同一女性面貌、左耳黑色耳挂、左领极细红灯线、炭黑高领大衣与后梳低髻完整保持
- 保持认可阳台图的正面嘴唇自然静置姿态，仅自然呼吸和轻微自然眨眼；不说话、不唱歌、不出现说话或演唱的连续口型、不转身、不抬手
