<h1>IRIS 换角：4 个方向</h1>
<div class="dim">每个方向左边是角色设定图（正面、侧面、背面全身＋头肩特写），右边是放进片中机房的剧照。都是 Codex 生图，不扣即梦积分。挑定后会把她的外型写成固定设定，放进之后每一个提示词。</div>
<h2>C1 叛逆</h2><div class="dim">铂金超短碎发、眼下一道红色光纹、亮红灯的银耳夹；皮夹克；挑衅的冷笑</div><div class="row"><img src="C1-sheet.png"><img src="C1-hero.png"></div>
<h2>C2 偶像</h2><div class="dim">黑色齐刘海波波头＋一缕红挑染、锋利眼线；白色立领短夹克＋交叉绑带、胸前红色状态灯；秀场主唱的气场</div><div class="row"><img src="C2b-sheet.png"><img src="C2b-hero.png"></div>
<h2>C3 黑客少女</h2><div class="dim">卷发小丸子、满脸雀斑、头顶护目镜一圈红灯；连帽卫衣＋机能背心挂数据线；好奇又调皮</div><div class="row"><img src="C3-sheet.png"><img src="C3-hero.png"></div>
<h2>C4 女王</h2><div class="dim">后梳低马尾、红色几何耳坠；宽肩雕塑大衣＋红腰带；居高临下、冷艳强势</div><div class="row"><img src="C4-sheet.png"><img src="C4-hero.png"></div>
</html>
