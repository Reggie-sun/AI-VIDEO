<h1>IRIS 换角：B 的画风，4 张欧美脸</h1>
<div class="dim">保留 B 的造型和画风（黑色齐刘海波波头、左侧红挑染、左耳亮红灯耳机、白府绸衬衫束黑宽腰带），脸换成欧美脸（你说「我要欧美风」）；都写明 28 岁成熟气质。每张脸三张：彩色近景特写（挑脸主要看这张）、黑白表情表、机房走秀。点图看大图。</div>
