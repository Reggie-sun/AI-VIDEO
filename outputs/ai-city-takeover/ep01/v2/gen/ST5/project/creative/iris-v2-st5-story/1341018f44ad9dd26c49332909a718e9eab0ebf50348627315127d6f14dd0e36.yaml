synopsis: 镜头固定。左边那个她把头靠近右边那个的耳边，轻轻说着悄悄话；远处一道冷白的扫描光慢慢扫过来，照到她们身上，两人同时停住。始终看不到她们的嘴。蓝黑和钢蓝统一色调，红色只在她领口的灯线和机柜门缝。画面中不得出现任何文字、字母、数字、标志或水印。
