synopsis: 镜头缓慢地横移。她抱着膝盖坐在地上，仰头望着头顶缓缓漂浮的发光薄片，一块薄片从她头顶慢慢飘过，光斑扫过她的脸。嘴唇自然闭合。蓝黑和钢蓝统一色调，红色只在她领口的灯线和机柜门缝。画面中不得出现任何文字、字母、数字、标志或水印。
