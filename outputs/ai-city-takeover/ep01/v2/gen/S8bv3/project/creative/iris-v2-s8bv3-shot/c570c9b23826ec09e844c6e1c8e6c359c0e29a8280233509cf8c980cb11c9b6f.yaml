intent: '真人电影摄影，横幅十六比九，连续五秒。第一张图是这个镜头的起始画面、构图与光线：同一位女性站在雨夜高层建筑的玻璃阳台上，四分之三侧面望向画面左侧，城市在她身后的右侧；第二张图只示范她在这一镜要达到的神情与投入程度；第三张图只示范她唱完后闭嘴望向远处城市的样子；第二、三张图都不是起始画面，也不改变构图；第四张图只控制她的面貌、左耳黑色耳挂与左领口极细红线，不继承第四张图的背景。

  音频是她自己演唱的一句歌。开头她先轻轻吸一口气；随后轻声而投入地演唱，嘴型与音频的每一个音节严格同步，口型饱满清晰，声音停顿时嘴型随之收小；唱最后一句时下巴微微抬起、眼睛半闭，情绪稍微放开但仍然克制；音频结束后双唇合拢，视线缓缓移向远处雾中的城市，胸口还带着唱完后的一点起伏。头部只随乐句轻微移动，不点头、不摆头、不抬手。

  摄影机完全固定在三脚架上，全程不推近、不拉远、不移动、不摇镜，保持第一张图的景别与人物位置。细雨在玻璃栏杆上缓慢滑落，背后城市灯光虚化。蓝黑与钢蓝冷色，红色只在她左领口的细灯线。牙齿和下巴自然稳定，不变形。

  保留平台正常人工智能生成标识，不删除、不遮挡它；不新增字幕、片名、文字、图形或界面。声音只跟随参考音频里的演唱，不新增其他人声、旁白、乐器或音乐；成片使用独立音轨。'
