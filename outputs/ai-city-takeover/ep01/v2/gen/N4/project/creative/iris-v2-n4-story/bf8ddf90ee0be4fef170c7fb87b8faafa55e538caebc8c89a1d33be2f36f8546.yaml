synopsis: 镜头缓慢横移跟随。她在悬浮的发光薄片之间慢慢走，抬手用指尖碰到一块薄片，薄片泛起一圈柔光后微微漂开，她收回手继续向前走，神情平静，嘴唇自然闭合。蓝黑和钢蓝统一色调，红色只在她领口的灯线。画面中不得出现任何文字、字母、数字、标志或水印。
