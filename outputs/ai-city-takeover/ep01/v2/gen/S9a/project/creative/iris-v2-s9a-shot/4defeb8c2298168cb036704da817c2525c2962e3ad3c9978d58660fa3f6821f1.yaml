intent: '真人电影摄影，横幅十六比九，连续六秒。首帧是这个镜头的起始画面：机房里一扇半开的黑色机柜门，门缝透出强烈的红光，线缆沿地面通往右侧的落地窗；尾帧是这个镜头的结束画面：同一机位，那扇机柜门已经完全关上，红光熄灭，只剩冷蓝。

  画面中没有人。开头红光门缝保持片刻，随后那扇机柜门平稳地转动关上，门缝逐渐变窄直到消失，红光随之熄灭，地面上的红色反光也消失。门关上后画面保持静止。

  摄影机固定不动，窗外城市灯光不变。蓝黑与钢蓝冷色，红色只在门缝里，门关上后不再有红色。

  保留平台正常人工智能生成标识，不删除、不遮挡它；不新增字幕、片名、文字、图形或界面。可以有一声轻微的机柜门关上声和极轻的机房环境声，不生成对白、旁白、演唱或音乐；成片使用独立音轨。'
