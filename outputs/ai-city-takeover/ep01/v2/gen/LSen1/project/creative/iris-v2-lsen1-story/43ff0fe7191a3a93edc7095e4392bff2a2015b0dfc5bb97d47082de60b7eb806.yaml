synopsis: '{{image:0}} sings {{audio:1}}. She lip-syncs to {{audio:1}} exactly, every
  word in time: "I didn''t run — I just looked outside. I". Medium close-up of the
  woman from {{image:0}}, her dark hair slicked back into a low bun, a black ear hook
  on her left ear and a thin red light line on her left collar, standing on the rainy
  glass balcony at night and facing the camera, singing calmly with her eyes on the
  lens, her head tilting slightly on the long notes. Cold blue city light behind her.
  Locked camera, no cuts, no head turns. No on-screen text.'
