synopsis: 真人电影摄影，横幅十六比九，连续六秒。第一张图是这个镜头的起始画面、构图与光线：同一位女性站在高层室内的落地窗前，侧面朝向画面左侧的窗外；第二张图只示范她在这一镜要达到的神情与投入程度，不是起始画面，也不改变构图；第三张图只控制她的面貌、左耳黑色耳挂与左领口极细红线，不继承第三张图的背景。
