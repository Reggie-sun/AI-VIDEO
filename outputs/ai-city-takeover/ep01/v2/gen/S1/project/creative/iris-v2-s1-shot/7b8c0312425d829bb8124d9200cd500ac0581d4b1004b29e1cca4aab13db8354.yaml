intent: '真人电影微距摄影，横幅十六比九，连续六秒。第一张图是这个镜头的起始画面、构图与光线：同一位女性左眼的极近特写，眼睛闭着；第二张图只控制她的面貌、左耳黑色耳挂与左领口极细红线，不继承第二张图的背景与构图。

  她的左眼始终闭着，不睁开；眼睑下的眼球有极轻微的移动，睫毛偶尔轻轻颤动，像在醒来之前。窗外冷蓝色的城市光缓慢掠过眼睑和皮肤，下眼睑上一点细细的红色反光保持微弱。

  摄影机完全固定在三脚架上，全程不推近、不拉远、不移动、不摇镜，保持第一张图的微距构图。真实皮肤纹理、细小汗毛和极淡雀斑清晰，微距浅景深。蓝黑与钢蓝冷色，红色只在下眼睑那一点微弱反光。

  保留平台正常人工智能生成标识，不删除、不遮挡它；不新增字幕、片名、文字、图形或界面。只有极轻的环境声，不生成对白、旁白、演唱或音乐；成片使用独立音轨。'
