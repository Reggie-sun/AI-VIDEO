synopsis: 真人电影微距摄影，横幅十六比九，连续六秒。第一张图是这个镜头的起始画面、构图与光线：同一位女性左眼的极近特写，眼睛闭着；第二张图只控制她的面貌、左耳黑色耳挂与左领口极细红线，不继承第二张图的背景与构图。
