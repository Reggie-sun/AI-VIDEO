synopsis: 镜头从她身后极缓慢地后拉。她静静站在落地窗前望着城市，过了一会儿头微微侧向一边，窗外的雾缓缓流动，城市灯光闪烁，地面映出她的倒影。始终看不到她的脸。蓝黑和钢蓝统一色调，红色只在她领口的灯线。画面中不得出现任何文字、字母、数字、标志或水印。
