synopsis: 镜头固定。她的手轻轻搭在门边，身体慢慢前倾，向红光门缝里望去，红光在她的侧脸上微微颤动，窗外城市灯光闪烁。嘴唇自然闭合。蓝黑和钢蓝统一色调，红色只在她领口的灯线和机柜门缝。画面中不得出现任何文字、字母、数字、标志或水印。
