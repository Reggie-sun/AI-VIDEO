synopsis: 镜头固定。她用手把机柜门慢慢推上，门缝里的红光越来越窄，直到完全熄灭，她垂着眼看着那道门缝。嘴唇自然闭合。蓝黑和钢蓝统一色调，红色只在她领口的灯线和机柜门缝。画面中不得出现任何文字、字母、数字、标志或水印。
