synopsis: 镜头极缓慢地向前推近最前排那个睁着眼的她。后排一排排闭着眼的她始终一动不动，像被暂停一样；她平静地看着镜头，只有轻微的呼吸。所有人嘴唇自然闭合。蓝黑和钢蓝统一色调，红色只在她领口的灯线和机柜门缝。画面中不得出现任何文字、字母、数字、标志或水印。
