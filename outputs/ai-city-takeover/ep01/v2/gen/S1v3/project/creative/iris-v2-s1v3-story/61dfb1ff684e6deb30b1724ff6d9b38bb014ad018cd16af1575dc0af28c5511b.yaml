synopsis: 真人电影微距摄影，横幅十六比九，连续六秒。首帧是这个镜头的起始画面：同一位女性左眼的极近特写，眼睛闭着；尾帧是这个镜头的结束画面：同一构图，她的左眼已经睁开，浅灰蓝色的虹膜清晰，正在对焦。
