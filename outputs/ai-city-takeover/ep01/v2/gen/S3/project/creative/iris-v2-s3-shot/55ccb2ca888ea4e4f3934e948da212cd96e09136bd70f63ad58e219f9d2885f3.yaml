intent: '真人电影摄影，横幅十六比九，连续六秒。参考图是这个镜头的起始画面、场景与光线：凌晨的数据中心机房走道，两侧是黑色服务器机柜，尽头左侧一扇半开的机柜门漏出一道窄窄的红光。

  画面中没有人。摄影机从走道中央齐胸高度出发，沿走道中轴非常缓慢、平稳地向前推进，越来越接近尽头那道红色门缝；红光在地面和对面机柜玻璃上的反光随推进变化。机柜玻璃后细小的冷蓝指示灯轻微闪烁，空气中有极淡的薄雾。

  保持对称构图，不转向、不摇镜、不切镜，末段平滑收稳。蓝黑与钢蓝冷色，红色只来自那道门缝。机柜上不出现可读文字。

  保留平台正常人工智能生成标识，不删除、不遮挡它；不新增字幕、片名、文字、图形或界面。只有极轻的机房风扇环境声，不生成对白、旁白、演唱或音乐；成片使用独立音轨。'
