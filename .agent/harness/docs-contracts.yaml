    canonical_spec: docs/superpowers/specs/2026-08-21-ai-video-video-planner-subagent.md
    canonical: true
    spec_status: accepted
    implementation_status: implemented_offline
    live_status: not_applicable
    quality_status: not_evaluated
    release_status: unreleased
    runtime_status_owner: docs/v0.2-runtime-baseline.md
    roadmap_owner: docs/v0.2-agentic-production-roadmap.md
    contract_version: video-planner/3
    implementation_paths:
      - src/ai_video/planning/video_planner.py
      - src/ai_video/planning/_planner_models.py
    test_paths:
      - tests/test_planning_video_planner.py
    harness_check_ids:
      - video_planner_tests
    assertions:
      - type: python_literal_equals
        path: src/ai_video/planning/video_planner.py
        symbol: VideoPlanner.CONTRACT_VERSION
        expected: video-planner/3
      - type: python_symbol_exists
        path: src/ai_video/planning/_planner_models.py
        symbol: VideoPlanningRequest.generation_intent
      - type: python_symbol_exists
        path: src/ai_video/planning/_planner_models.py
        symbol: VideoGenerationPlan.generation_requirement
      - type: python_symbol_absent
        path: src/ai_video/planning/_planner_models.py
        symbol: VideoGenerationPlan.plan_hint
      - type: text_not_contains
        path: src/ai_video/planning/video_planner.py
        text: plan_hint=

