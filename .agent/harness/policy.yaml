version: 2
status: active
runs_dir: .agent/harness/runs
default_timeout_seconds: 900
capture_pytest_junit: true

note: >
  This policy maps an exact staged or commit-range task delta to mandatory existing
  tests and checks. The Harness does not dispatch agents, modify product state, run
  live Provider smoke, or replace AGENTS.md, code, tests, and runtime evidence.

ignored_patterns:
  - .pytest_cache/**
  - __pycache__/**
  - "**/__pycache__/**"

sensitive_patterns:
  - .env
  - .env.*
  - "**/.env"
  - "**/.env.*"
  - "*credential*"
  - "*secret*"
  - "**/*credential*"
  - "**/*secret*"

audit_patterns:
  - .github/workflows/**
  - src/**/*.py
  - scripts/*.py
  - scripts/**/*.py
  - tests/*.py
  - tests/**/*.py
  - tests/test_*.py
  - tests/conftest.py
  - workflows/**

audit_exempt_patterns:
  - scripts/__init__.py

always_check_ids:
  - scope_diff_check

fallback_check_ids:
  - full_tests
  - task_architecture_gate

checks:
  scope_diff_check:
    argv: [git, diff, --check]
    cwd: .
    scope_diff: true
    description: Check exact staged or commit-range patch whitespace and conflict markers.
  harness_tests:
    argv: [python, -m, pytest, -p, no:cacheprovider, tests/test_agent_harness.py, -q]
    cwd: .
    description: Verify Harness scope, routing, isolation, receipts, and Make targets.
  architecture_tests:
    argv: [python, -m, pytest, -p, no:cacheprovider, tests/test_architecture_gate.py, tests/test_architecture_gate_cli.py, -q]
    cwd: .
    description: Verify deterministic Architecture Gate behavior and CLI contracts.
  cli_config_tests:
    argv: [python, -m, pytest, -p, no:cacheprovider, tests/test_cli.py, tests/test_config.py, tests/test_errors.py, -q]
    cwd: .
    description: Verify CLI, config, path, and typed-error contracts.
  workflow_tests:
    argv: [python, -m, pytest, -p, no:cacheprovider, tests/test_workflow_loader.py, tests/test_workflow_renderer.py, -q]
    cwd: .
    description: Verify workflow loading and pure binding/rendering.
  legacy_runtime_tests:
    argv: [python, -m, pytest, -p, no:cacheprovider, tests/test_comfy_client.py, tests/test_pipeline.py, tests/test_manifest.py, tests/test_resume_e2e.py, tests/test_ffmpeg_tools.py, -q]
    cwd: .
    description: Verify Legacy transport, orchestration, resume, manifest, and ffmpeg behavior.
  mcp_tests:
    argv: [python, -m, pytest, -p, no:cacheprovider, tests/test_mcp_probe.py, tests/test_mcp_frames.py, tests/test_mcp_transcribe.py, tests/test_mcp_scene_detect.py, tests/test_mcp_analyze.py, tests/test_mcp_review.py, tests/test_mcp_optimize_plan.py, tests/test_mcp_apply_optimization.py, -q]
    cwd: .
    description: Verify project-local video-analysis MCP tools.
  production_contract_tests:
    argv: [python, -m, pytest, -p, no:cacheprovider, tests, -k, production, -q]
    cwd: .
    timeout_seconds: 1800
    description: Verify all Production surfaces for shared schema, reader, writer, and lifecycle owners.
  production_reader_tests:
    argv: [python, -m, pytest, -p, no:cacheprovider, tests/test_production_models.py, tests/test_production_validation.py, tests/test_production_registry.py, tests/test_production_project.py, tests/test_config.py, tests/test_cli.py, -q]
    cwd: .
    description: Verify strict read-only Production project contracts and Legacy isolation.
  production_state_tests:
    argv: [python, -m, pytest, -p, no:cacheprovider, tests/test_production_bootstrap.py, tests/test_production_state_commit.py, tests/test_production_state_recovery.py, tests/test_production_state_commit_structure.py, tests/test_production_models.py, tests/test_production_project.py, -q]
    cwd: .
    description: Verify the single Production writer, activation, and explicit recovery.
  production_composition_audio_tests:
    argv: [python, -m, pytest, -p, no:cacheprovider, tests/test_production_composition.py, tests/test_production_hyperframes.py, tests/test_production_audio.py, tests/test_production_captions.py, tests/test_production_elevenlabs.py, tests/test_production_minimax_speech.py, tests/test_production_voice_captions_e2e.py, tests/test_production_state_commit.py, tests/test_production_state_recovery.py, -q]
    cwd: .
    description: Verify timeline, renderer, audio, voice, and caption contracts.
  production_dependency_tests:
    argv: [python, -m, pytest, -p, no:cacheprovider, tests/test_production_dependency.py, tests/test_production_selective_rebuild.py, tests/test_production_models.py, tests/test_production_project.py, tests/test_production_state_commit.py, tests/test_production_state_recovery.py, -q]
    cwd: .
    description: Verify immutable graph inputs and precise selective rebuild.
  production_review_tests:
    argv: [python, -m, pytest, -p, no:cacheprovider, tests/test_mcp_review.py, tests/test_mcp_optimize_plan.py, tests/test_mcp_apply_optimization.py, tests/test_production_review.py, tests/test_production_continuity_evaluator.py, tests/test_production_repair.py, tests/test_production_state_commit.py, tests/test_production_state_recovery.py, -q]
    cwd: .
    description: Verify durable review, authorization, repair, and final acceptance.
  production_image_tests:
    argv: [python, -m, pytest, -p, no:cacheprovider, tests/test_production_image.py, tests/test_production_image_e2e.py, tests/test_production_comfy_image.py, tests/test_production_image_import.py, tests/test_production_p7_1_local_image_e2e.py, tests/test_production_models.py, tests/test_production_registry.py, tests/test_production_validation.py, tests/test_production_project.py, tests/test_production_dependency.py, tests/test_production_selective_rebuild.py, tests/test_production_state_commit.py, tests/test_production_state_recovery.py, tests/test_comfy_client.py, tests/test_workflow_loader.py, -q]
    cwd: .
    description: Verify image contracts, local adapter, truthful import, activation, and recovery.
  production_video_provider_tests:
    argv: [python, -m, pytest, -p, no:cacheprovider, tests/test_production_paid_provider.py, tests/test_production_paid_provider_state.py, tests/test_production_paid_provider_e2e.py, tests/test_production_video.py, tests/test_production_continuity_evaluator.py, tests/test_production_video_fake.py, tests/test_production_video_state_recovery.py, tests/test_production_generated_video_e2e.py, tests/test_production_local_video_state.py, tests/test_production_comfy_video.py, tests/test_production_comfy_t8_video.py, tests/test_production_comfy_t8_turbo_video.py, tests/test_production_local_h3_provider_family.py, tests/test_production_minimax_h3.py, tests/test_production_minimax_hailuo.py, tests/test_production_seedance.py, tests/test_production_state_commit.py, tests/test_production_state_recovery.py, -q]
    cwd: .
    description: Verify paid-provider safety and generated-video contracts without live submit.
  production_shot_router_tests:
    argv: [python, -m, pytest, -p, no:cacheprovider, tests/test_production_shot_router.py, tests/test_production_video.py, tests/test_production_dependency.py, tests/test_production_selective_rebuild.py, -q]
    cwd: .
    description: Verify pure Shot routing, exact video capabilities, and dependency isolation.
  video_planner_tests:
    argv: [python, -m, pytest, -p, no:cacheprovider, tests/test_planning_video_planner.py, tests/test_errors.py, -q]
    cwd: .
    description: Verify provider-neutral Video Planner proposals and Main Agent STOP semantics.
  provider_neutral_video_requirement_tests:
    argv: [python, -m, pytest, -p, no:cacheprovider, tests/test_production_video_requirement.py, tests/test_planning_video_planner.py, tests/test_production_shot_router.py, tests/test_production_video_fake.py, tests/test_production_provider_neutral_adapters.py, tests/test_production_video.py, -q]
    cwd: .
    description: Verify the sealed neutral requirement, Router binding, adapter compiler result, and lifecycle lineage.
  shot_readiness_gate_tests:
    argv: [python, -m, pytest, -p, no:cacheprovider, tests/test_shot_readiness_gate.py, tests/test_planning_video_planner.py, tests/test_production_video_requirement.py, tests/test_errors.py, -q]
    cwd: .
    description: Verify exact planning lineage, structural readiness, typed STOP diagnostics, and compatibility handoff.
  quality_intelligence_tests:
    argv: [python, -m, pytest, -p, no:cacheprovider, tests/test_quality_experience_models.py, tests/test_quality_experience_store.py, tests/test_quality_experience_dataset.py, tests/test_quality_experience_rag_projection.py, tests/test_agent_memory.py, -q]
    cwd: .
    description: Verify passive Quality Experience schemas, immutable closure, exact lookup, sanitized projection, and Agent Memory isolation without live Provider or index rebuild.
  full_tests:
    argv: [python, -m, pytest, -p, no:cacheprovider, -q]
    cwd: .
    timeout_seconds: 1800
    description: Fail-safe full suite with credentials removed and pytest non-loopback sockets blocked.
  task_architecture_gate:
    argv: [python, -m, scripts.architecture_gate, check]
    cwd: .
    task_architecture: true
    description: Reject architecture regressions introduced by the exact task delta.
  repository_architecture_gate:
    argv: [python, -m, scripts.architecture_gate, check]
    cwd: .
    description: Report repository health against the version-controlled architecture baseline.

