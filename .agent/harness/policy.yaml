version: 2
status: active
runs_dir: .agent/harness/runs
default_timeout_seconds: 900
capture_pytest_junit: true

note: >
  This policy maps an exact staged or commit-range task delta to mandatory existing
  tests and checks. The Harness does not dispatch agents, modify product state, run
  live Provider smoke, or replace AGENTS.md, code, tests, and runtime evidence. A
  check with covered_by_check_ids remains selected and is skipped only after every
  listed covering check has actually passed in the same exact-snapshot run.

ignored_patterns:
  - .pytest_cache/**
  - __pycache__/**
  - "**/__pycache__/**"
  - .workflow/**
  - index.json
  - runs/.gitkeep

sensitive_patterns:
  - .env
  - .env.*
  - "**/.env"
  - "**/.env.*"
  - "*credential*"
  - "*secret*"
  - "**/*credential*"
  - "**/*secret*"

audit_patterns:
  - AGENTS.md
  - README.md
  - Makefile
  - .gitattributes
  - .gitignore
  - .github/workflows/**
  - .agent/harness/*.yaml
  - .architecture/architecture-baseline.json
  - .claude/settings/*.json
  - .codex/*.toml
  - .codex/hooks.json
  - .mcp.json
  - architecture_gate.toml
  - skills-lock.json
  - pyproject.toml
  - package.json
  - package-lock.json
  - configs/**
  - docs/agent-primary-contract-matrix.md
  - docs/v0.2-runtime-baseline.md
  - docs/v0.2-agentic-production-roadmap.md
  - docs/superpowers/specs/**
  - docs/superpowers/plans/**
  - src/**/*.py
  - scripts/*.py
  - scripts/**/*.py
  - tests/*.py
  - tests/**/*.py
  - tests/test_*.py
  - tests/conftest.py
  - tests/fixtures/**
  - provider-console/**
  - workflows/**

audit_exempt_patterns:
  - scripts/__init__.py
  - provider-console/dist/**
  - provider-console/node_modules/**

audit_explicit_test_patterns:
  - tests/test_*.py
  - provider-console/tests/*.test.mjs

audit_unreferenced_test_exempt_patterns:
  # Included by production_contract_tests through pytest's node-id-aware
  # `tests -k production` selector and intentionally kept as a full E2E.
  - tests/test_production_base_ai_comic_e2e.py

always_check_ids:
  - scope_diff_check
  - docs_contract_check
  - policy_audit_check
  - product_runtime_skill_boundary_tests

fallback_check_ids:
  - full_tests
  - task_architecture_gate

checks:
  scope_diff_check:
    argv: [git, diff, --check]
    cwd: .
    scope_diff: true
    execution_priority: 0
    description: Check exact staged or commit-range patch whitespace and conflict markers.
  docs_contract_check:
    argv: [python, -m, scripts.docs_contract_gate, check]
    cwd: .
    execution_priority: 10
    description: Verify canonical documentation metadata and repository contract coherence.
  policy_audit_check:
    argv: [python, -m, scripts.agent_harness, policy-audit]
    cwd: .
    execution_priority: 15
    description: Fail fast on unmapped, unverified, missing, or unreferenced owned paths before expensive suites.
  composition_playbook_tests:
    argv: [python, -m, pytest, -p, no:cacheprovider, tests/test_composition_playbooks.py, -q]
    cwd: .
    description: Verify strict deterministic Composition Playbook schema and advisory boundaries.
  composition_strategy_proposal_tests:
    argv: [python, -m, pytest, -p, no:cacheprovider, tests/test_composition_strategy_proposal.py, -q]
    cwd: .
    description: Verify typed shadow proposal sealing and pure planner comparison semantics.
  composition_architecture_tests:
    argv: [python, -m, pytest, -p, no:cacheprovider, tests/test_composition_architecture.py, -q]
    cwd: .
    description: Verify Product Runtime isolation from Development Governance composition tooling.
  ecommerce_ad_workflow_skill_tests:
    argv: [python, -m, pytest, -p, no:cacheprovider, tests/test_ecommerce_ad_workflow_skill.py, -q]
    cwd: .
    description: Verify the ecommerce advertising authoring Skill, schemas, validator, fixtures, and no-I/O boundaries.
  seedance_authoring_skill_tests:
    argv: [python, -m, pytest, -p, no:cacheprovider, tests/test_seedance_authoring_skill.py, -q]
    cwd: .
    description: Verify minimal Seedance authoring dispatch, progressive version loading, and advisory authority boundaries.
  experience_learning_skill_tests:
    argv: [python, -m, pytest, -p, no:cacheprovider, tests/test_distill_ai_video_learning_skill.py, -q]
    cwd: .
    description: Verify automatic advisory Learning Claim distillation, exact user confirmation, adoption routing, and no-Production boundaries.
  product_runtime_skill_boundary_tests:
    argv: [python, -m, pytest, -p, no:cacheprovider, tests/test_runtime_skill_boundary.py, -q]
    cwd: .
    execution_priority: 18
    description: Reject Agent Skill imports, loaders, paths, and direct Skill identities in Product Runtime source.
  harness_tests:
    argv: [python, -m, pytest, -p, no:cacheprovider, tests/test_docs_contract_gate.py, tests/test_agent_harness.py, tests/test_record_ai_video_session_hook.py, -q]
