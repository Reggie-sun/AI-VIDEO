  local_comfyui_supervisor_tests:
    argv: [python, -m, pytest, -p, no:cacheprovider, tests/test_comfyui_supervisor.py, -q]
    cwd: .
    description: Verify explicit user-systemd ownership, loopback health checks, and scoped local ComfyUI lifecycle controls.
  architecture_tests:
