    cwd: .
    npm_workspace_dependency_paths: [provider-console/node_modules]
    description: Build the Provider Console Sites bundle in the isolated verification worktree.
  provider_console_sites_tests:
    argv: [node, --test, provider-console/tests/sites-worker.test.mjs]
    cwd: .
    npm_workspace_dependency_paths: [provider-console/node_modules]
