    argv: [python, -m, pytest, -p, no:cacheprovider, tests/test_agent_memory.py, -q]
    cwd: .
    description: Verify the read-only developer Agent Memory index and retrieval boundaries.
  full_tests:
    argv: [python, -m, pytest, -p, no:cacheprovider, -q]
    cwd: .
    timeout_seconds: 1800
    execution_priority: 30
    covers_check_ids:
      - commercial_source_preparation_tests
      - composition_playbook_tests
      - composition_strategy_proposal_tests
      - composition_architecture_tests
      - ecommerce_ad_workflow_skill_tests
      - seedance_authoring_skill_tests
      - experience_learning_skill_tests
      - product_runtime_skill_boundary_tests
      - harness_tests
      - local_comfyui_supervisor_tests
      - architecture_tests
      - cli_config_tests
      - workflow_tests
      - legacy_runtime_tests
