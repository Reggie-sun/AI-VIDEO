      - provider_neutral_video_requirement_tests
      - shot_readiness_gate_tests
      - quality_intelligence_tests
      - provider_console_python_tests
      - agent_memory_tests
    description: Fail-safe full suite with credentials removed and pytest non-loopback sockets blocked.
  task_architecture_gate:
    argv: [python, -m, scripts.architecture_gate, check]
    cwd: .
    task_architecture: true
    execution_priority: 20
    description: Reject architecture regressions introduced by the exact task delta.
  repository_architecture_gate:
    argv: [python, -m, scripts.architecture_gate, check]
    cwd: .
    description: Report repository health against the version-controlled architecture baseline.

